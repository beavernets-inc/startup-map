<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architecture Map</title>
<!-- One external link only (the Inter font). Inline the woff2 as base64 to go fully offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ARCHITECTURE MAP — C4 container level, "Stage" house style.
   DATA-DRIVEN: edit only the MODEL object near the bottom; the
   engine renders boxes, pills and arrows from it. Features:
     · Model D drill-down — click a card/pill → detail reveals
       INLINE inside the card; card grows, neighbours reflow,
       arrows recompute (no side panel).
     · Networking toggle — port/protocol on edges + address line
       on boxes (default off).
     · copy buttons on file chips · pan (hold-drag) · wheel-zoom.
   Theme via CSS variables — change --accent to rebrand. Muted
   per-layer tints + neutral infra gray (anti-AI-slop). Self-contained.
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ---- accent: the single brand knob (auto-pick from repo, else this) ---- */
  --accent:#2563EB;--accent-dark:#1E40AF;--accent-soft:#EFF4FF;
  /* ---- neutrals ---- */
  --ink:#0B1220;--muted:#5A6678;--surface:#fff;--canvas-bg:#FAFBFC;--divider:#E4E8EE;
  --good:#10B981;--warn:#F59E0B;--bad:#EF4444;
  /* ---- LAYER TINTS: muted, equal-lightness; only show the ones you use ---- */
  --l-frontend:#2563EB;--l-frontend-soft:#EFF3FF;
  --l-backend:#7C3AED;--l-backend-soft:#F3EEFE;
  --l-data:#0D9488;--l-data-soft:#E7F6F4;
  --l-external:#D97706;--l-external-soft:#FBF1E3;
  --l-mcp:#DB2777;--l-mcp-soft:#FCEDF4;
  --l-infra:#64748B;--l-infra-soft:#EEF2F6;
  --edge:#94A3B8;--edge-strong:#475569;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;--shadow:0 4px 24px rgba(15,23,42,.08);
}
html[data-theme="dark"]{
  --accent:#60A5FA;--accent-dark:#3B82F6;--accent-soft:#1E293B;
  --ink:#F1F5F9;--muted:#94A3B8;--surface:#1E293B;--canvas-bg:#0B1220;--divider:#334155;
  --l-frontend:#60A5FA;--l-frontend-soft:#16243B;--l-backend:#A78BFA;--l-backend-soft:#231b3a;
  --l-data:#2DD4BF;--l-data-soft:#0f2b29;--l-external:#FBBF24;--l-external-soft:#2e2410;
  --l-mcp:#F472B6;--l-mcp-soft:#321023;--l-infra:#94A3B8;--l-infra-soft:#1b2433;
  --edge:#64748B;--edge-strong:#CBD5E1;
}
html,body{height:100%}
body{font-family:var(--font);background:var(--canvas-bg);color:var(--ink);overflow:hidden;display:flex;flex-direction:column}

#topbar{flex:none;display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid var(--divider);background:var(--surface)}
.wordmark{font-size:17px;font-weight:800;display:flex;align-items:center;gap:9px}
.wordmark .dot{width:13px;height:13px;border-radius:4px;background:var(--accent)}
#topbar .sep{color:var(--divider)}
#topbar .title{font-size:17px;font-weight:700}
#topbar .meta{font-size:13px;color:var(--muted)}
#topbar .spacer{flex:1}
.nettog{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
.nettog input{display:none}
.nettog .sw{width:34px;height:19px;border-radius:999px;background:var(--divider);position:relative;transition:background .15s}
.nettog .sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.nettog input:checked + .sw{background:var(--accent)}
.nettog input:checked + .sw::after{transform:translateX(15px)}
.zoom{display:flex;align-items:center;gap:6px}
.zoom button{font-family:var(--font);font-size:15px;font-weight:700;color:var(--ink);width:31px;height:31px;border:1px solid var(--divider);background:var(--surface);border-radius:9px;cursor:pointer;line-height:1}
.zoom button:hover{border-color:var(--accent);background:var(--accent-soft)}
.zoom .fit{width:auto;padding:0 12px;font-size:13px}
.zoom .pct{font-size:12px;color:var(--muted);min-width:42px;text-align:center}

#legend{flex:none;display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:10px 24px;border-bottom:1px solid var(--divider);background:var(--surface);font-size:12.5px}
#legend .lg{display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:600}
#legend .sw{width:13px;height:13px;border-radius:4px;border:1.5px solid var(--ink)}
#legend .eh{display:flex;align-items:center;gap:7px;color:var(--muted);margin-left:auto}
#legend .eh svg{width:32px;height:12px}
#legend .tip-hint{font-size:11.5px;color:var(--muted);opacity:.85}

#canvas{flex:1;overflow:auto;position:relative;cursor:grab}
#canvas.grabbing{cursor:grabbing}
#diagram{position:relative;width:max-content;min-width:100%;padding:46px 56px 64px;transform-origin:top left;user-select:none}
#edges{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
#edge-labels{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}
.edge-label{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:700;color:var(--edge-strong);background:var(--canvas-bg);padding:2px 7px;border-radius:7px;border:1px solid var(--divider);white-space:nowrap}
.edge-label.net{color:var(--accent-dark);border-color:var(--accent);background:var(--accent-soft)}

.tier-row{display:flex;gap:46px;align-items:flex-start;justify-content:center;margin-bottom:54px;position:relative;z-index:3;flex-wrap:wrap}
.tier-row:last-child{margin-bottom:0}

.container,.node{position:relative;background:var(--surface);box-shadow:var(--shadow);z-index:3;cursor:grab}
.container.dragging,.node.dragging{cursor:grabbing;z-index:5;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.container{border-radius:16px;border:1.5px solid var(--layer);min-width:224px;max-width:340px}
.container.expanded{max-width:470px}
.container::before,.node::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--layer-soft);opacity:.5;pointer-events:none}
.container>*,.node>*{position:relative}
.chead{display:flex;flex-direction:column;gap:3px;padding:14px 17px 11px;border-bottom:1px solid var(--divider);cursor:pointer;border-radius:16px 16px 0 0}
.chead:hover{background:rgba(0,0,0,.015)}
.ct{display:flex;align-items:center;gap:9px}
.ctitle{font-size:16px;font-weight:800;letter-spacing:-.3px}
.ctech{font-size:11.5px;font-weight:600;color:var(--layer);text-transform:uppercase;letter-spacing:.05em}
.ctag{margin-left:auto;font-size:10px;font-weight:700;color:#fff;background:var(--layer);padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.caret{font-size:11px;color:var(--muted);padding:2px 6px;border-radius:6px;margin-left:6px}
.caret:hover{background:rgba(0,0,0,.06)}
.container.collapsed .caret{transform:rotate(-90deg)}
.netline{font-size:11px;font-family:var(--mono);color:var(--accent-dark);background:var(--accent-soft);border-radius:6px;padding:3px 8px;margin-top:6px;display:none;white-space:nowrap}
.netline.show{display:block}
.comps{display:flex;flex-wrap:wrap;gap:7px;padding:13px 15px 15px}
.container.collapsed .comps{display:none}
.pill{font-size:12.5px;font-weight:600;color:var(--ink);background:var(--canvas-bg);border:1px solid var(--divider);border-left:3px solid var(--layer);border-radius:8px;padding:6px 10px;cursor:pointer;transition:transform .1s,border-color .12s,background .12s}
.pill:hover{border-color:var(--layer);background:var(--layer-soft);transform:translateY(-1px)}
.pill.active{background:var(--layer);border-color:var(--layer);color:#fff}

/* node = a box with no components (a DB, an actor, a single service) */
.node{border-radius:13px;border:1.5px solid var(--layer);min-width:150px;max-width:300px;cursor:pointer}
.node .nhead{padding:14px 18px;text-align:center}
.node.expanded{max-width:430px}
.node .nt{font-size:15px;font-weight:800}
.node .ns{font-size:11px;font-weight:600;color:var(--layer);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.node .netline{text-align:left;margin:8px 14px 0}

/* Model D — detail revealed INSIDE the card */
.inline{display:flex;flex-direction:column;gap:9px;padding:0 15px 15px}
.inline:empty{display:none}
.node .inline{padding:0 14px 14px}
.idrow{border:1px solid var(--divider);border-left:3px solid var(--layer);border-radius:10px;background:var(--canvas-bg);padding:12px 14px;animation:reveal .22s cubic-bezier(.2,.7,.2,1)}
@keyframes reveal{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.idrow-h{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800;margin-bottom:8px}
.idrow-h .dot{width:8px;height:8px;border-radius:3px;background:var(--layer);flex:none}
.idrow-x{margin-left:auto;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:0 4px}
.idrow-x:hover{color:var(--ink)}
.idrow .d2{font-size:13px;line-height:1.55;color:var(--ink)}
.dlabel{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:11px 0 6px}
.files{display:flex;flex-direction:column;gap:5px}
.fl{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--surface);border:1px solid var(--divider);padding:4px 5px 4px 9px;border-radius:7px}
.fl .path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.fl .cp{flex:none;font-family:var(--font);font-size:10.5px;font-weight:700;color:var(--accent-dark);background:var(--accent-soft);border:none;border-radius:5px;padding:3px 8px;cursor:pointer}
.fl .cp:hover{background:var(--accent);color:#fff}
.kids{display:flex;flex-direction:column;gap:7px}
.kid{display:flex;gap:10px;font-size:12.5px;line-height:1.45}
.kid b{font-weight:700;color:var(--ink);flex:none;min-width:108px;font-family:var(--mono);font-size:11.5px}
.kid span{color:var(--muted)}
.talks{display:flex;flex-wrap:wrap;gap:6px}
.talk{font-size:11.5px;font-weight:600;color:var(--edge-strong);background:var(--surface);border:1px solid var(--divider);border-radius:999px;padding:3px 10px}
.talk b{color:var(--ink)}

#tip{position:fixed;z-index:99;pointer-events:none;opacity:0;background:var(--ink);color:#fff;border-radius:9px;padding:8px 11px;font-size:11.5px;font-weight:600}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:9px;opacity:0;transition:opacity .18s,transform .18s;z-index:99;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
@media print{body{overflow:visible;height:auto}#canvas{overflow:visible}.zoom,.nettog{display:none}}
</style>
</head>
<body>
<div id="topbar">
  <div class="wordmark"><span class="dot"></span><span id="wm-brand"></span></div>
  <span class="sep">/</span><span class="title" id="wm-title"></span>
  <span class="meta" id="wm-meta">Architecture map</span>
  <span class="spacer"></span>
  <label class="nettog"><input type="checkbox" id="net"><span class="sw"></span>Network details</label>
  <div class="zoom">
    <button class="fit" id="z-fit">Fit</button><button id="z-out">&minus;</button>
    <span class="pct" id="z-pct">100%</span><button id="z-in">+</button>
  </div>
</div>
<div id="legend"></div>
<div id="canvas">
  <div id="diagram">
    <svg id="edges"><defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--edge)"></path></marker>
    </defs></svg>
    <div id="edge-labels"></div>
    <div id="rows"></div>
  </div>
</div>
<div id="tip"></div>
<div id="toast"></div>

<script>
/* ============================================================
   MODEL — THE ONLY THING THE SKILL EDITS. The engine renders it.
   Fill from the approved review-gate model + the enrichment pass.

   node (a box). kind:'container' has pills; kind:'node' has none.
     {label, tech, layer, kind, summary, entry:[..], net?, talksTo?[],
      components:[ {id,label,one, summary, files:[..], kids?[{label,txt}], talksTo?[{to,via}], net?} ]}
   edge: {from:<nodeId>, to:<nodeId>, label, net?}   (ids are NODE ids, not component ids)
   layout: rows of node ids, laid out top→down (client → server → data/external).

   Detail fields drive the Model D drill-down:
     summary  = 1–2 sentences (component) / 2–3 (card overview)
     files    = real path(s)/glob(s) — shown with a copy button
     kids     = flat child list (routes/screens/tools/stages/tables), CAP ~8 then "+N more"
     talksTo  = this thing's edges, e.g. {to:'PostgreSQL', via:'PostgREST'}
     net      = networking facts (ports/domains/TLS), shown only when the toggle is on
   Keep only the layers you use in `legend`. Everything must trace to real code.
   ============================================================ */
const MODEL = {
  repo:'my-repo',          // title (and document title); the real repo name
  brand:'Brand',           // wordmark left of the title; a short product name — omit to reuse repo
  date:'',                 // generation date; leave '' to auto-fill today
  legend:[['frontend','Frontend'],['backend','Backend'],['data','Data'],['external','External']],
  layout:[
    ['c-frontend','c-backend'],
    ['n-postgres','c-external'],
  ],
  nodes:{
    'c-frontend':{label:'Web App',tech:'React · Vite',layer:'frontend',kind:'container',
      net:'served at app.example.com : 443',
      summary:'Single-page client. Renders the UI and calls the backend over REST; holds no business logic of record.',
      entry:['src/main.tsx'],
      components:[
        {id:'fe-routes',label:'Routes',one:'client routing',
          summary:'Declares the app’s routes and guards.',files:['src/routes/*.tsx'],
          kids:[{label:'/',txt:'Home.'},{label:'/dash',txt:'Dashboard.'},{label:'/settings',txt:'User settings.'}]},
        {id:'fe-stores',label:'Stores',one:'client state',
          summary:'Client state for auth and app data.',files:['src/stores/auth.ts','src/stores/app.ts']},
        {id:'fe-api',label:'API client',one:'talks to backend',
          summary:'Typed fetch wrapper for the REST API.',files:['src/lib/api.ts'],talksTo:[{to:'Backend API',via:'REST'}]},
      ]},
    'c-backend':{label:'Backend API',tech:'FastAPI · Python',layer:'backend',kind:'container',
      net:'uvicorn : 8000 behind nginx',
      summary:'Stateless API. Validates requests, runs services, persists to Postgres.',
      entry:['app/main.py'],
      components:[
        {id:'be-routes',label:'/api routes',one:'HTTP endpoints',
          summary:'Route handlers grouped by resource.',files:['app/api/routes/*.py']},
        {id:'be-services',label:'Services',one:'business logic',
          summary:'Use-cases the routes call; the only layer that touches the DB.',files:['app/services/*.py'],talksTo:[{to:'PostgreSQL',via:'SQL'}]},
        {id:'be-llm',label:'LLM client',one:'external calls',
          summary:'Wraps the model provider.',files:['app/services/llm.py'],talksTo:[{to:'External APIs',via:'HTTPS'}]},
      ]},
    'n-postgres':{label:'PostgreSQL',tech:'Database',layer:'data',kind:'node',
      net:'127.0.0.1:5432 (loopback)',
      summary:'System of record. Reached only by the backend services layer via SQLAlchemy.',files:['app/models/*.py']},
    'c-external':{label:'External APIs',tech:'3rd-party',layer:'external',kind:'container',net:'HTTPS : 443',
      summary:'Third-party services the backend calls.',
      components:[
        {id:'x-anthropic',label:'Anthropic',one:'LLM',summary:'api.anthropic.com/v1/messages for generation.',files:['app/services/llm.py']},
        {id:'x-stripe',label:'Stripe',one:'billing',summary:'Payment intents + webhooks.',files:['app/services/billing.py']},
      ]},
  },
  edges:[
    {from:'c-frontend',to:'c-backend',label:'REST',net:'443'},
    {from:'c-backend',to:'n-postgres',label:'SQL',net:'127.0.0.1:5432'},
    {from:'c-backend',to:'c-external',label:'HTTPS',net:'443'},
  ],
};

/* ============================================================
   ENGINE — do not edit when filling a map (only the MODEL above).
   ============================================================ */
const $=id=>document.getElementById(id);
const diagram=$('diagram'),canvas=$('canvas'),svg=$('edges'),labelLayer=$('edge-labels'),rowsEl=$('rows');
const SVGNS='http://www.w3.org/2000/svg';
let zoom=1, netMode=false;
const lv=l=>`--layer:var(--l-${l});--layer-soft:var(--l-${l}-soft)`;

$('legend').innerHTML = MODEL.legend.map(([l,name])=>
  `<span class="lg"><span class="sw" style="background:var(--l-${l}-soft);border-color:var(--l-${l})"></span>${name}</span>`).join('')
  + `<span class="eh"><svg viewBox="0 0 32 12"><line x1="0" y1="6" x2="26" y2="6" stroke="var(--edge)" stroke-width="2"/><path d="M26 2 L32 6 L26 10 Z" fill="var(--edge)"/></svg>calls / data flow</span>`
  + `<span class="tip-hint">· click a card or pill to expand it in place · toggle network details above</span>`;

/* Topbar text comes from MODEL — no {{placeholders}} to hand-edit. */
document.title = MODEL.repo + ' — Architecture Map';
$('wm-brand').textContent = MODEL.brand || MODEL.repo;
$('wm-title').textContent = MODEL.repo;
$('wm-meta').textContent = 'Architecture map · ' + (MODEL.date || new Date().toISOString().slice(0,10));

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function renderDiagram(){
  rowsEl.innerHTML='';
  for(const rowIds of MODEL.layout){
    const row=document.createElement('div'); row.className='tier-row';
    for(const id of rowIds){
      const n=MODEL.nodes[id]; if(!n) continue;
      const el=document.createElement('div'); el.id=id; el.setAttribute('style',lv(n.layer));
      const netLine=n.net?`<div class="netline">${esc(n.net)}</div>`:'';
      if(n.kind==='node'){
        el.className='node';
        el.innerHTML=`<div class="nhead"><div class="nt">${esc(n.label)}</div><div class="ns">${esc(n.tech)}</div></div>${netLine}<div class="inline" data-inline="${id}"></div>`;
      }else{
        el.className='container';
        el.innerHTML=`<div class="chead" data-cid="${id}">
            <div class="ct"><span class="ctitle">${esc(n.label)}</span><span class="ctag">${esc(n.layer)}</span><span class="caret" data-collapse="${id}">▼</span></div>
            <span class="ctech">${esc(n.tech)}</span>${netLine}</div>
          <div class="comps">${(n.components||[]).map(cm=>`<div class="pill" data-cid="${id}" data-comp="${cm.id}">${esc(cm.label)}</div>`).join('')}</div>
          <div class="inline" data-inline="${id}"></div>`;
      }
      row.appendChild(el);
    }
    rowsEl.appendChild(row);
  }
  applyNetLines();
}
function filesHtml(files){return `<div class="dlabel">Files</div><div class="files">`+files.map(f=>{const p=esc(f);return `<div class="fl"><span class="path" title="${p}">${p}</span><button class="cp" data-copy="${p}">copy</button></div>`}).join('')+`</div>`}
function kidsHtml(kids){return `<div class="dlabel">Inside</div><div class="kids">`+kids.map(k=>`<div class="kid"><b>${esc(k.label)}</b><span>${esc(k.txt)}</span></div>`).join('')+`</div>`}
function talksHtml(t){return `<div class="dlabel">Talks to</div><div class="talks">`+t.map(x=>`<span class="talk"><b>${esc(x.to)}</b> · ${esc(x.via)}</span>`).join('')+`</div>`}
function detailBody(d){
  return `<div class="d2">${esc(d.summary)}</div>`
    + (d.entry?`<div class="dlabel">Entry point</div><div class="files">`+d.entry.map(f=>{const p=esc(f);return `<div class="fl"><span class="path">${p}</span><button class="cp" data-copy="${p}">copy</button></div>`}).join('')+`</div>`:'')
    + (d.files?filesHtml(d.files):'')
    + (d.kids?kidsHtml(d.kids):'')
    + (d.talksTo?talksHtml(d.talksTo):'');
}
function toggleInline(cid,key){
  const host=document.querySelector(`.inline[data-inline="${cid}"]`);
  const existing=host.querySelector(`.idrow[data-c="${key}"]`);
  const pill=document.querySelector(`.pill[data-cid="${cid}"][data-comp="${key}"]`);
  if(existing){existing.remove(); if(pill)pill.classList.remove('active');}
  else{
    const n=MODEL.nodes[cid];
    const d=key==='__overview__'?{summary:n.summary,entry:n.entry,files:n.files,talksTo:n.talksTo}:n.components.find(x=>x.id===key);
    const title=key==='__overview__'?n.label+' — overview':d.label;
    const div=document.createElement('div'); div.className='idrow'; div.dataset.c=key;
    div.innerHTML=`<div class="idrow-h"><span class="dot"></span>${esc(title)}<span class="idrow-x">×</span></div>`+detailBody(d);
    host.appendChild(div); if(pill)pill.classList.add('active');
  }
  host.closest('.container,.node').classList.toggle('expanded', host.children.length>0);
  drawEdges();
}
/* arrows: getBoundingClientRect, recomputed on every layout change (expand/zoom/resize) */
function relRect(el){const r=el.getBoundingClientRect(),b=diagram.getBoundingClientRect();
  return {left:(r.left-b.left)/zoom,top:(r.top-b.top)/zoom,right:(r.right-b.left)/zoom,bottom:(r.bottom-b.top)/zoom,
    cx:(r.left-b.left)/zoom+r.width/zoom/2,cy:(r.top-b.top)/zoom+r.height/zoom/2}}
/* Tier-aware: boxes in DIFFERENT rows (vertical ranges don't overlap) route vertically —
   exit top/bottom, cross in the empty gutter between rows. Same-row boxes route horizontally.
   This keeps the cross-travel in a card-free gutter, so a line never cuts through a box. */
function anchors(a,b){let p1,p2,axis;
  const sameRow = a.top < b.bottom && b.top < a.bottom;
  if(!sameRow){axis='v';
    if(b.cy>=a.cy){p1={x:a.cx,y:a.bottom};p2={x:b.cx,y:b.top};}
    else{p1={x:a.cx,y:a.top};p2={x:b.cx,y:b.bottom};}}
  else{axis='h';
    if(b.cx>=a.cx){p1={x:a.right,y:a.cy};p2={x:b.left,y:b.cy};}
    else{p1={x:a.left,y:a.cy};p2={x:b.right,y:b.cy};}}
  return {p1,p2,axis}}
/* Orthogonal (Manhattan) routing: the cross-travel runs in the gutter BETWEEN the two
   boxes' facing edges. For the tier-row layout that gutter is empty, so a line never
   crosses a card. Aligned boxes collapse to a straight segment. Corners are sharp —
   simplest path that's provably correct; drag a card if a skip-row edge ever clips one.
   ponytail: sharp 3-segment; add A-star / obstacle-routing only if skip-row maps overlap in practice. */
function bezier(p1,p2,axis){
  if(axis==='v'){const my=(p1.y+p2.y)/2;return `M${p1.x},${p1.y} L${p1.x},${my} L${p2.x},${my} L${p2.x},${p2.y}`}
  const mx=(p1.x+p2.x)/2;return `M${p1.x},${p1.y} L${mx},${p1.y} L${mx},${p2.y} L${p2.x},${p2.y}`}
function drawEdges(){
  [...svg.querySelectorAll('path.edge')].forEach(p=>p.remove()); labelLayer.innerHTML='';
  svg.setAttribute('width',diagram.scrollWidth); svg.setAttribute('height',diagram.scrollHeight);
  for(const e of MODEL.edges){
    const A=$(e.from),B=$(e.to); if(!A||!B) continue;
    const {p1,p2,axis}=anchors(relRect(A),relRect(B));
    const path=document.createElementNS(SVGNS,'path');
    path.setAttribute('class','edge'); path.setAttribute('d',bezier(p1,p2,axis));
    path.setAttribute('fill','none'); path.setAttribute('stroke','var(--edge)'); path.setAttribute('stroke-width','2');
    path.setAttribute('marker-end','url(#arrow)'); svg.appendChild(path);
    const lab=document.createElement('div'); const showNet=netMode&&e.net;
    lab.className='edge-label'+(showNet?' net':''); lab.textContent=showNet?e.net:e.label;
    lab.style.left=((p1.x+p2.x)/2)+'px'; lab.style.top=((p1.y+p2.y)/2)+'px'; labelLayer.appendChild(lab);
  }
}
function applyNetLines(){document.querySelectorAll('.netline').forEach(n=>n.classList.toggle('show',netMode))}
$('net').addEventListener('change',e=>{netMode=e.target.checked;applyNetLines();drawEdges();});
function applyZoom(z){zoom=Math.max(.3,Math.min(2,z));diagram.style.transform='scale('+zoom+')';$('z-pct').textContent=Math.round(zoom*100)+'%';drawEdges();}
function fit(){diagram.style.transform='scale(1)';zoom=1;applyZoom(Math.min(1,(canvas.clientWidth-40)/diagram.scrollWidth));}
$('z-in').onclick=()=>applyZoom(zoom+0.1);$('z-out').onclick=()=>applyZoom(zoom-0.1);$('z-fit').onclick=fit;
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();
  const vx=e.clientX-r.left,vy=e.clientY-r.top,sx=vx+canvas.scrollLeft,sy=vy+canvas.scrollTop,prev=zoom;
  applyZoom(zoom*(e.deltaY<0?1.1:1/1.1));const k=zoom/prev;canvas.scrollLeft=sx*k-vx;canvas.scrollTop=sy*k-vy;},{passive:false});
let panning=false,pX,pY,pL,pT;
canvas.addEventListener('mousedown',e=>{if(e.button!==0)return;panning=true;pX=e.clientX;pY=e.clientY;pL=canvas.scrollLeft;pT=canvas.scrollTop;canvas.classList.add('grabbing');});
addEventListener('mousemove',e=>{if(!panning)return;canvas.scrollLeft=pL-(e.clientX-pX);canvas.scrollTop=pT-(e.clientY-pY);});
addEventListener('mouseup',()=>{panning=false;canvas.classList.remove('grabbing');});
/* Drag a card to nudge spacing. Offset is a CSS translate on the card; getBoundingClientRect
   already includes it, so drawEdges() re-routes around the new position. Starting a drag on a
   card stops the canvas pan; a real move swallows the trailing click so it doesn't drill in. */
const offsets={};let dCard=null,dSX,dSY,dOX,dOY,dMoved;
diagram.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  if(e.target.closest('.pill,.cp,[data-collapse],.idrow,.idrow-x'))return;
  const card=e.target.closest('.container,.node'); if(!card)return;
  e.stopPropagation();                       // don't let canvas start panning
  dCard=card;const o=offsets[card.id]||{x:0,y:0};dOX=o.x;dOY=o.y;dSX=e.clientX;dSY=e.clientY;dMoved=false;
  card.classList.add('dragging');
});
addEventListener('mousemove',e=>{
  if(!dCard)return;
  if(Math.abs(e.clientX-dSX)+Math.abs(e.clientY-dSY)>4)dMoved=true;
  const o={x:dOX+(e.clientX-dSX)/zoom,y:dOY+(e.clientY-dSY)/zoom};offsets[dCard.id]=o;
  dCard.style.transform=`translate(${o.x}px,${o.y}px)`;drawEdges();
});
addEventListener('mouseup',()=>{
  if(!dCard)return;dCard.classList.remove('dragging');
  if(dMoved){const swallow=ev=>{ev.stopPropagation();removeEventListener('click',swallow,true)};addEventListener('click',swallow,true);}
  dCard=null;
});
const toast=$('toast');let toastT;
function flash(m){toast.textContent=m;toast.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toast.classList.remove('show'),1200);}
document.addEventListener('click',e=>{
  const cp=e.target.closest('.cp');
  if(cp){navigator.clipboard?.writeText(cp.dataset.copy).then(()=>flash('Copied  '+cp.dataset.copy)).catch(()=>flash('Copy failed'));return;}
  const col=e.target.closest('[data-collapse]');
  if(col){e.stopPropagation();col.closest('.container').classList.toggle('collapsed');drawEdges();return;}
  const x=e.target.closest('.idrow-x');
  if(x){const r=x.closest('.idrow');toggleInline(r.closest('.inline').dataset.inline,r.dataset.c);return;}
  const pill=e.target.closest('.pill');
  if(pill){toggleInline(pill.dataset.cid,pill.dataset.comp);return;}
  const node=e.target.closest('.node');
  if(node){toggleInline(node.id,'__overview__');return;}
  const head=e.target.closest('.chead');
  if(head){toggleInline(head.dataset.cid,'__overview__');return;}
});
renderDiagram();
addEventListener('resize',drawEdges);
addEventListener('load',()=>requestAnimationFrame(()=>{drawEdges();fit();}));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawEdges);
requestAnimationFrame(drawEdges);
</script>
</body>
